name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: macos-latest
            name: mac
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build (tag = publish to Release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npx electron-builder ${{ matrix.args }} --publish always \
              -c.publish.provider=github \
              -c.publish.owner=${{ github.repository_owner }} \
              -c.publish.repo=${{ github.event.repository.name }}
          else
            npx electron-builder ${{ matrix.args }} --publish never \
              -c.publish.provider=github \
              -c.publish.owner=${{ github.repository_owner }} \
              -c.publish.repo=${{ github.event.repository.name }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Crave-Admin-Panel-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
