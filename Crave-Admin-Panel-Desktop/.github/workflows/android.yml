name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Android project
        run: |
          node scripts/prepare-www.js
          npx cap add android
          node scripts/android-patch.js
          npx cap sync android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks android-signing/crave-admin.keystore \
            --ks-key-alias crave --ks-pass pass:crave-admin-2026 --key-pass pass:crave-admin-2026 \
            --out out/Crave-Admin-Panel-Android.apk out/aligned.apk
          "$BT/apksigner" verify out/Crave-Admin-Panel-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Crave-Admin-Panel-android
          path: out/Crave-Admin-Panel-Android.apk
          if-no-files-found: error

      - name: Attach APK to Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Crave-Admin-Panel-Android.apk
